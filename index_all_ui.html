<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raja | Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Tektur:wght@900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
/* =====================================================
   BASE = MOBILE (phones, portrait tablets)
   Desktop / laptop layout is in the media query below.
   ===================================================== */
*{box-sizing:border-box}
html{
    margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;
    font-size:10px;-webkit-text-size-adjust:100%;
    background:#0b0f0c url('assets/bg.png') center/cover no-repeat;
}
body{
    margin:0;width:100%;height:100%;
    display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;
    gap:12px 10px;
    padding:64px 16px 40px;
    overflow-x:hidden;overflow-y:auto;
    -webkit-overflow-scrolling:touch;
}
a{text-decoration:none}

/* RAJA title */
.center{
    position:relative;z-index:1;pointer-events:none;
    width:100%;display:flex;flex-direction:row;justify-content:center;gap:8px;
    font-family:'Tektur',sans-serif;font-weight:1000;
    font-size:min(28vw,150px);line-height:1;
}
.center h1{margin:0;font-size:inherit}
.R1,.R2,.R3,.R4{background-position:center;background-repeat:no-repeat;background-clip:text;-webkit-background-clip:text;color:transparent}
.R1{background-image:url(assets/1.gif)}
.R2{background-image:url(assets/2.gif)}
.R3{background-image:url(assets/3.gif)}
.R4{background-image:url(assets/4.gif)}

/* glass buttons */
.glass-btn{
    position:relative;z-index:1000;pointer-events:auto;
    padding:10px 18px;
    background:rgba(255,255,255,.1);
    backdrop-filter:blur(1px);-webkit-backdrop-filter:blur(1px);
    border:1px solid rgba(255,255,255,.5);border-radius:12px;
    color:#fff;font-size:18px;font-family:'Tektur';cursor:pointer;
    box-shadow:0 8px 32px rgba(0,0,0,.2);
    transition:background .3s ease,border-color .3s ease;
}
.glass-btn:hover{background:rgba(255,255,255,.25);border-color:#fff;filter:brightness(1.3)}

/* section text */
.section-text{
    width:100%;color:#fff;font-family:'Tektur';
    font-size:16px;line-height:1.7;text-align:left;
    white-space:pre-line;text-shadow:0 1px 6px rgba(0,0,0,.6);
}
.section-text:empty{display:none}

/* skills */
.skills-container{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.skill-card{
    min-height:62px;padding:6px 2px;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    background:rgba(255,255,255,.1);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,.3);border-radius:15px;
    color:#fff;font-family:'Tektur';transition:.3s ease;
}
.skill-card i{font-size:28px}
.skill-card span{font-size:13px}
.skill-card:hover{transform:translateY(-5px);background:rgba(255,255,255,.2)}

/* projects */
.projects-container{display:grid;grid-template-columns:1fr;gap:12px;overflow:visible}
.project-card{
    position:relative;width:100%;min-height:44px;padding:10px 12px;
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:rgba(255,255,255,.1);backdrop-filter:blur(2px);
    border:1px solid rgba(255,255,255,.3);border-radius:15px;
    color:#fff;font-family:'Tektur';
}
.project-name{color:#fff;cursor:pointer;position:relative;z-index:2;flex:1;white-space:normal;overflow-wrap:break-word;line-height:1.3}
.project-github{color:#fff;font-size:22px;transition:.3s ease}
.project-github:hover{transform:scale(1.2);color:#aaa}
.project-info{cursor:pointer;z-index:10;flex-shrink:0;outline:none;padding:4px}
.project-info i{width:25px;height:25px;display:flex;justify-content:center;align-items:center;border:1px solid #fff;border-radius:50%}
.project-details{
    position:absolute;top:calc(100% + 6px);left:0;right:0;width:auto;padding:10px;
    background:rgba(15,15,15,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.4);border-radius:12px;
    color:#fff;font-size:13px;line-height:1.5;
    opacity:0;visibility:hidden;pointer-events:none;transition:.3s ease;
    font-family:'Franklin Gothic Medium','Arial Narrow',Arial,sans-serif;z-index:999;
}
.project-info:hover .project-details,
.project-info:focus .project-details,
.project-info:focus-within .project-details{opacity:1;visibility:visible;pointer-events:auto}

/* contact */
.contact-container{display:flex;flex-direction:column;gap:18px;width:100%;color:#fff}
.contact-details{display:grid;grid-template-columns:1fr;gap:12px}
.contact-item{
    display:flex;align-items:center;gap:15px;padding:12px;
    background:rgba(255,255,255,.147);border:1px solid rgba(255,255,255,.15);border-radius:10px;transition:.3s ease;
}
.contact-item:hover{background:rgba(255,255,255,.12);transform:translateY(-4px)}
.contact-item i{font-size:23px;color:#b8c7d9;width:26px;text-align:center}
.contact-item h3{font-size:14px;margin:0 0 5px;color:#aaa}
.contact-item a,.contact-item p{font-size:13px;color:#fff;margin:0;overflow-wrap:anywhere}
.contact-item a:hover{color:#b8c7d9}
.contact-form{display:grid;grid-template-columns:1fr;gap:12px;width:100%}
.contact-form input,.contact-form textarea{
    width:100%;padding:13px 15px;
    background:rgba(255,255,255,.458);border:1px solid rgba(255,255,255,.2);border-radius:8px;
    outline:none;color:#fff;font-family:inherit;font-size:16px;transition:.3s;
}
.contact-form input::placeholder,.contact-form textarea::placeholder{color:#121212}
.contact-form textarea{resize:vertical;height:90px}
.contact-form input:hover,.contact-form textarea:hover,
.contact-form input:focus,.contact-form textarea:focus{background:#fff;color:#000;border-color:#fff}
.contact-form input:hover::placeholder,.contact-form textarea:hover::placeholder,
.contact-form input:focus::placeholder,.contact-form textarea:focus::placeholder{color:#666}
.contact-form button{
    height:46px;padding:12px 15px;
    background:rgba(255,255,255,.405);color:#0d0d0d;
    border:1px solid rgba(255,255,255,.3);border-radius:8px;cursor:pointer;font-size:15px;transition:.3s;
}
.contact-form button:hover{background:#fff;color:#000}
.contact-form button i{margin-left:8px}
#form-status{margin:0;font-size:14px}

/* reset button */
#reset-btn{
    position:fixed;top:12px;right:12px;width:40px;height:40px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);border-radius:50%;
    color:#fff;font-size:16px;cursor:pointer;z-index:9999;transition:.3s ease;
}
#reset-btn:hover{background:#fff;color:#000;transform:rotate(180deg)}

/* cursor leaves */
.cursor-leaf{position:fixed;pointer-events:none;z-index:99999;font-size:30px;transform:translate(-50%,-50%);animation:leafFall 1s ease-out forwards}
@keyframes leafFall{
    0%{opacity:.8;transform:translate(0,0) rotate(0) scale(1)}
    100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--rotate)) scale(.6)}
}

/* page loader */
#page-loader{
    position:fixed;inset:0;background:#080b09;display:flex;justify-content:center;align-items:center;
    z-index:999999;overflow:hidden;transition:opacity .6s ease,visibility .6s ease;
}
#page-loader.loader-hidden{opacity:0;visibility:hidden;pointer-events:none}
.loader-content{position:relative;text-align:center;z-index:2}
.loader-name{
    color:#f4f4f0;font-family:Arial,sans-serif;font-size:min(65px,15vw);font-weight:600;
    letter-spacing:14px;animation:nameReveal .8s ease forwards;
}
.loader-subtitle{color:#9aaa91;font-size:10px;letter-spacing:5px;margin-top:15px;opacity:0;animation:subtitleReveal .6s ease .5s forwards}
.leaf{position:absolute;left:50%;top:60%;font-size:24px;pointer-events:none;opacity:0;animation:leafFly 2.3s ease-out forwards}
.leaf:nth-child(1){left:45%;--x:-160px;--y:-180px;--r:-240deg;animation-delay:.1s}
.leaf:nth-child(2){--x:130px;--y:-200px;--r:180deg;animation-delay:.2s}
.leaf:nth-child(3){left:48%;--x:-90px;--y:-250px;--r:270deg;animation-delay:.35s}
.leaf:nth-child(4){left:52%;--x:190px;--y:-100px;--r:320deg;animation-delay:.45s}
.leaf:nth-child(5){left:48%;--x:-210px;--y:-80px;--r:200deg;animation-delay:.55s}
.leaf:nth-child(6){--x:70px;--y:-280px;--r:360deg;animation-delay:.65s}
.leaf:nth-child(7){--x:-250px;--y:-220px;--r:180deg;animation-delay:.8s}
.leaf:nth-child(8){--x:240px;--y:-230px;--r:280deg;animation-delay:.9s}
.leaf:nth-child(9){--x:-40px;--y:-320px;--r:220deg;animation-delay:1s}
.leaf:nth-child(10){--x:180px;--y:-300px;--r:350deg;animation-delay:1.1s}
@keyframes nameReveal{from{opacity:0;transform:translateY(15px);letter-spacing:25px}to{opacity:1;transform:translateY(0);letter-spacing:14px}}
@keyframes subtitleReveal{to{opacity:1}}
@keyframes leafFly{
    0%{opacity:0;transform:translate(0,40px) rotate(0) scale(.3)}
    15%{opacity:1}
    70%{opacity:.9}
    100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(1.2)}
}

/* Wider mobile / small tablet portrait: 2 project columns, 2 contact columns */
@media (min-width:600px){
    .projects-container{grid-template-columns:1fr 1fr}
    .contact-details{grid-template-columns:1fr 1fr}
    .section-text{font-size:19px}
}

/* =====================================================
   LAPTOP (100%) + DESKTOP (125% zoom) = landscape >= 900px
   Everything is sized in rem. 1rem = 10 "design px" and the root
   size follows the window, so the layout scales as one piece.
   Reference size: 1536 x 740 (a 1920 screen at 125%).
   ===================================================== */
@media (min-width:900px) and (min-aspect-ratio:1/1){
    html{font-size:min(.651vw,1.37vh)}
    body{
        display:flex;flex-wrap:nowrap;justify-content:center;align-items:center;align-content:normal;
        gap:0;padding:0;overflow:hidden;
    }
    .center{
        width:auto;gap:1rem;font-size:20rem;line-height:normal;margin-right:35rem;
    }
    .center h1{margin:.67em 0;font-size:1em}

    .glass-btn{position:absolute;padding:1.2rem 2.5rem;font-size:2.5rem;border-radius:1.2rem}
    .aboutme_btn{top:10rem;right:21rem;transform:rotate(10deg)}
    .edu_btn{top:23rem;right:2rem;transform:rotate(-10deg)}
    .skil_btn{top:37rem;right:12rem;transform:rotate(5deg)}
    .pro_btn{bottom:25rem;right:21rem;transform:rotate(10deg)}
    .cont_btn{bottom:8rem;right:45rem;transform:rotate(15deg)}

    .section-text{width:auto;text-shadow:none;line-height:normal}
    .section-text:empty{display:block}
    #about-text{position:absolute;top:3rem;left:50%;transform:translateX(-50%);font-size:2.5rem;white-space:pre-wrap}
    #edu-text{position:absolute;top:3rem;left:4rem;font-size:2.2rem;line-height:1.8;max-width:calc(100vw - 42rem)}

    .skills-container{
        position:absolute;top:3rem;left:4rem;width:55rem;
        grid-template-columns:repeat(4,12rem);gap:1.5rem;justify-content:start;align-items:start;
    }
    .skill-card{width:12rem;height:6rem;min-height:0;padding:0;justify-content:flex-start;border-radius:1.5rem}
    .skill-card i{font-size:3.5rem}
    .skill-card span{font-size:max(11px,1.4rem)}

    .projects-container{position:absolute;top:3rem;left:4rem;width:65rem;grid-template-columns:repeat(4,22rem);gap:1.5rem}
    .project-card{width:20rem;min-height:4rem;padding:1rem;gap:.5rem;border-radius:1.5rem;font-size:max(12px,1.6rem)}
    .project-github{font-size:max(15px,2.1rem)}
    .project-info{position:relative;padding:0}
    .project-info i{width:2.5rem;height:2.5rem;font-size:max(10px,1.3rem)}
    .project-details{top:5rem;left:0;right:auto;width:33rem;padding:1rem;font-size:max(11px,1.3rem);border-radius:1.2rem}

    .contact-container{
        position:absolute;top:2rem;left:4rem;width:65rem;height:calc(100% - 4rem);gap:0;
    }
    .contact-details{gap:2.2rem}
    .contact-item{gap:1.5rem;padding:1.2rem;border-radius:1rem}
    .contact-item i{font-size:max(15px,2.3rem);width:auto}
    .contact-item h3{font-size:max(11px,1.4rem);margin:0 0 .5rem}
    .contact-item a,.contact-item p{font-size:max(11px,1.3rem)}
    .contact-form{grid-template-columns:1fr 1fr;gap:1.2rem;margin-top:auto;padding-top:3rem}
    .contact-form input,.contact-form textarea{padding:1.3rem 1.5rem;font-size:max(12px,1.4rem);border-radius:.8rem}
    .contact-form textarea{height:4.5rem}
    .contact-form button{height:4.5rem;padding:1.2rem 1.5rem;margin:0 5rem;font-size:max(12px,1.4rem);border-radius:.8rem}
    #form-status{font-size:max(12px,1.4rem)}

    #reset-btn{top:2.5rem;right:3rem;width:4.2rem;height:4.2rem;font-size:max(14px,1.7rem)}
}
</style>
</head>
<body>

<!-- LOADER -->
<div id="page-loader">
    <span class="leaf">🍃</span><span class="leaf">🍂</span><span class="leaf">🍃</span><span class="leaf">🍃</span><span class="leaf">🍂</span>
    <span class="leaf">🍃</span><span class="leaf">🍂</span><span class="leaf">🍃</span><span class="leaf">🍃</span><span class="leaf">🍂</span>
    <div class="loader-content">
        <h1 class="loader-name">RAJA</h1>
        <p class="loader-subtitle">MY PORTFOLIO</p>
    </div>
</div>

<div class="center">
    <h1 class="R1">R</h1>
    <h1 class="R2">A</h1>
    <h1 class="R3">J</h1>
    <h1 class="R4">A</h1>
</div>

<a href="#" class="glass-btn aboutme_btn" onclick="showAbout(event)">About Me</a>
<a href="#" class="glass-btn edu_btn" onclick="showEducation(event)">Education</a>
<a href="#" class="glass-btn skil_btn" onclick="showSkills(event)">Skills</a>
<a href="#" class="glass-btn pro_btn" onclick="showProjects(event)">Projects</a>
<a href="#" class="glass-btn cont_btn" onclick="showContact(event)">Contact</a>

<div id="about-text" class="section-text"></div>
<div id="edu-text" class="section-text"></div>
<div id="skill-text" class="section-text skills-container"></div>
<div id="project-text" class="section-text projects-container"></div>
<div id="contact-text" class="section-text"></div>

<!-- RESET BUTTON -->
<button id="reset-btn" title="Reset Portfolio"><i class="fa-solid fa-rotate-right"></i></button>

<script>
// PAGE LOADING ANIMATION
const loader = document.getElementById("page-loader");
const loaderStart = Date.now();
window.addEventListener("load", function () {
    const remaining = Math.max(0, 2800 - (Date.now() - loaderStart));
    setTimeout(() => {
        loader.classList.add("loader-hidden");
        setTimeout(() => { loader.style.display = "none"; }, 600);
    }, remaining);
});

// FALLING LEAVES CURSOR ANIMATION
let lastLeafTime = 0;
document.addEventListener("mousemove", function (e) {
    const now = Date.now();
    if (now - lastLeafTime < 100) return;
    lastLeafTime = now;

    const leaf = document.createElement("span");
    leaf.className = "cursor-leaf";
    const leaves = ["🍃", "🍂"];
    leaf.innerHTML = leaves[Math.floor(Math.random() * leaves.length)];
    leaf.style.left = e.clientX + "px";
    leaf.style.top = e.clientY + "px";
    leaf.style.setProperty("--x", (Math.random() * 50 - 25) + "px");
    leaf.style.setProperty("--y", (Math.random() * 50 + 30) + "px");
    leaf.style.setProperty("--rotate", (Math.random() * 180 - 90) + "deg");
    document.body.appendChild(leaf);
    setTimeout(() => leaf.remove(), 2200);
});

// MAIN TYPING FUNCTION
let typingTimer;
let activeElementId = null;

function clearText() {
    clearTimeout(typingTimer);
    document.querySelectorAll(".section-text").forEach(el => { el.innerHTML = ""; });
    activeElementId = null;
}

function typeText(elementId, content, speed = 40) {
    let element = document.getElementById(elementId);

    // SECOND CLICK: DISPLAY ALL CONTENT INSTANTLY
    if (activeElementId === elementId) {
        clearTimeout(typingTimer);
        element.innerHTML = "";
        content.forEach(line => {
            let div = document.createElement("div");
            div.textContent = line;
            element.appendChild(div);
        });
        return;
    }

    // FIRST CLICK: START TYPING ANIMATION
    clearText();
    activeElementId = elementId;
    let line = 0;

    function typeLine() {
        if (line < content.length) {
            let div = document.createElement("div");
            element.appendChild(div);
            let char = 0;
            function typeChar() {
                if (char < content[line].length) {
                    div.textContent += content[line].charAt(char);
                    char++;
                    typingTimer = setTimeout(typeChar, speed);
                } else {
                    line++;
                    typingTimer = setTimeout(typeLine, 300);
                }
            }
            typeChar();
        }
    }
    typeLine();
}

// ABOUT ME
function showAbout(event) {
    event.preventDefault();
    typeText("about-text", [
        "Hello! I am Raja, a passionate developer interested in technology, creativity and innovation."
    ], 50);
}

// EDUCATION
function showEducation(event) {
    event.preventDefault();
    typeText("edu-text", [
        "B.Sc. (Hons) Computer Science and Cognitive Systems | CGPA: 8.45/10 | 2024 - 2027",
        "P.B. Siddhartha College of Arts and Science, Vijayawada",
        "Intermediate (BiPC) | 93.4% |Andhra Loyola College, Vijayawada| 2022 - 2024",
        "SSC | 87.3% | Abhyasa Vidyalayam, Gundala, Vijayawada| 2021 – 2022 "
    ], 40);
}

// SKILLS
function showSkills(event) {
    event.preventDefault();
    clearText();

    let skills = [
        { name: "Python", icon: "fa-brands fa-python" },
        { name: "Java", icon: "fa-brands fa-java" },
        { name: "HTML", icon: "fa-brands fa-html5" },
        { name: "CSS", icon: "fa-brands fa-css3-alt" },
        { name: "JavaScript", icon: "fa-brands fa-js" },
        { name: "GitHub", icon: "fa-brands fa-github" },
        { name: "Flask", icon: "fa-solid fa-flask" },
        { name: "Database", icon: "fa-solid fa-database" }
    ];

    let element = document.getElementById("skill-text");
    skills.forEach(skill => {
        let card = document.createElement("div");
        card.className = "skill-card";
        card.innerHTML = `
            <i class="${skill.icon}"></i>
            <span>${skill.name}</span>
        `;
        element.appendChild(card);
    });
}

// PROJECTS
function showProjects(event) {
    event.preventDefault();
    clearText();

    let projects = [
        {
            name: "StudywithR",
            link: "https://rajakantu-44.github.io/StudywithR/",
            repo: "https://github.com/rajakantu-44/StudywithR",
            details: "Created and launched a study website where classmates find organized handwritten notes and other resources | Techstack :  HTML, CSS and JavaScript."
        },
        {
            name: "Smart Resume Builder",
            link: "https://github.com/yourusername/project",
            repo: "https://github.com/rajakantu-44/smart_resume_builder",
            details: "Built a web app that helps students and job seekers create resumes, using the Gemini API for content suggestions | Techstack : HTML, CSS, JavaScript, Python Flask, Gemini API.."
        },
        {
            name: "Campus Care",
            link: "https://github.com/yourusername/project",
            repo: "https://github.com/rajakantu-44/Campus-Care-Hackathon-",
            details: "Built during an intra-departmental college hackathon, a complaint management platform where students raise complaints and administrators track them by department | Techstack : HTML, CSS, JavaScript, Python, MongoDB, JWT Authentication, REST API"
        }
    ];

    let element = document.getElementById("project-text");
    projects.forEach(project => {
        let card = document.createElement("div");
        card.className = "project-card";
        // tabindex lets a tap on touch screens open the details popup
        card.innerHTML = `
            <a href="${project.link}" target="_blank" class="project-name">${project.name}</a>
            <a href="${project.repo}" target="_blank" class="project-github" title="View Repository">
                <i class="fa-brands fa-github"></i>
            </a>
            <div class="project-info" tabindex="0">
                <i class="fa-solid fa-circle-info"></i>
                <div class="project-details">${project.details}</div>
            </div>
        `;
        element.appendChild(card);
    });
}

// CONTACT
function showContact(event) {
    event.preventDefault();
    clearText();

    const contact = document.getElementById("contact-text");
    contact.innerHTML = `
        <div class="contact-container">
            <div class="contact-details">
                <div class="contact-item">
                    <i class="fa-solid fa-envelope"></i>
                    <div>
                        <h3>Email</h3>
                        <a href="mailto:rajakantu44@gmail.com">rajakantu44@gmail.com</a>
                    </div>
                </div>
                <div class="contact-item">
                    <i class="fa-solid fa-phone"></i>
                    <div>
                        <h3>Phone</h3>
                        <a href="tel:+919014819874">+91 9014819874</a>
                    </div>
                </div>
                <div class="contact-item">
                    <i class="fa-brands fa-linkedin"></i>
                    <div>
                        <h3>LinkedIn</h3>
                        <a href="https://www.linkedin.com/in/raja-kantu44/" target="_blank">https://www.linkedin.com/in/raja-kantu44/</a>
                    </div>
                </div>
                <div class="contact-item">
                    <i class="fa-solid fa-location-dot"></i>
                    <div>
                        <h3>Location</h3>
                        <p>Vijayawada, Andhra Pradesh, India</p>
                    </div>
                </div>
            </div>

            <form class="contact-form" id="contact-form">
                <input type="text" name="name" placeholder="Your Name" required>
                <input type="email" name="email" placeholder=" Your Email" required>
                <input type="text" name="subject" placeholder="Subject" required>
                <textarea name="message" placeholder="Message" required></textarea>
                <button type="submit" id="send-btn">Send Message <i class="fa-solid fa-paper-plane"></i></button>
                <p id="form-status"></p>
            </form>
        </div>
    `;
}

// INITIALIZE EMAILJS
(function () {
    emailjs.init({ publicKey: "18mkro1F-9x0E8SaP" });
})();

// CONTACT FORM SUBMISSION
document.addEventListener("submit", function (e) {
    if (e.target.id !== "contact-form") return;
    e.preventDefault();

    const form = e.target;
    const button = form.querySelector("#send-btn");
    const status = form.querySelector("#form-status");

    button.disabled = true;
    button.innerHTML = "Sending...";

    emailjs.sendForm("service_04lgwmo", "template_p7c5ilu", form)
        .then(() => {
            status.textContent = "Message sent successfully!";
            status.style.color = "#90ee90";
            form.reset();
        })
        .catch((error) => {
            console.error("EmailJS Error:", error);
            status.textContent = "Failed to send message. Try again.";
            status.style.color = "#ff7777";
        })
        .finally(() => {
            button.disabled = false;
            button.innerHTML = `Send Message <i class="fa-solid fa-paper-plane"></i>`;
        });
});

// RESET PORTFOLIO
document.getElementById("reset-btn").addEventListener("click", function () {
    clearText();
    document.querySelectorAll(".glass-btn").forEach(btn => btn.classList.remove("active"));
});
</script>
</body>
</html>
